spring.application.name=LojaCarro

# Banco em memoria (modo MySQL) para os testes. As migrations do Flyway sao executadas
# e o Hibernate valida se as entidades batem com o schema criado.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

loja.jwt.segredo=segredo-usado-apenas-nos-testes-automatizados-123
loja.jwt.expiracao-minutos=60
loja.cors.origens=http://localhost:4200
loja.imagens.diretorio=target/imagens-teste
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
loja.agenda.abertura=08:00
loja.agenda.fechamento=18:00
loja.agenda.fechamento-sabado=12:00
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
loja.logs.url=http://localhost:65530
loja.logs.api-key=chave-usada-nos-testes-123
