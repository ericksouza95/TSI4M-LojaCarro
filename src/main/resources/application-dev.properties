# Desenvolvimento local: valores padrao para facilitar, podem ser sobrescritos por variaveis de ambiente
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lojacarro?createDatabaseIfNotExist=true&serverTimezone=America/Fortaleza}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Credenciais de DEMONSTRACAO (apenas ambiente local)
loja.admin.email=${ADMIN_EMAIL:admin@lojacarro.local}
loja.admin.senha=${ADMIN_SENHA:admin123}

# Segredo JWT de DESENVOLVIMENTO. Em producao, defina JWT_SECRET com um valor aleatorio.
loja.jwt.segredo=${JWT_SECRET:segredo-local-de-desenvolvimento-nao-usar-em-producao}
