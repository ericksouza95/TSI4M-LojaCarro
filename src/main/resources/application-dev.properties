# Desenvolvimento local (banco do docker-compose.yml): valores padrao que podem ser sobrescritos por variaveis de ambiente
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lojacarro?serverTimezone=America/Fortaleza}
spring.datasource.username=${DB_USERNAME:lojacarro}
spring.datasource.password=${DB_PASSWORD:lojacarro}

# Mude para true para ver os comandos SQL no console
spring.jpa.show-sql=false

# Credenciais de DEMONSTRACAO (apenas ambiente local)
loja.admin.email=${ADMIN_EMAIL:admin@lojacarro.local}
loja.admin.senha=${ADMIN_SENHA:admin123}
loja.demo.cliente-email=${DEMO_CLIENTE_EMAIL:cliente@lojacarro.local}
loja.demo.cliente-senha=${DEMO_CLIENTE_SENHA:cliente123}

# Segredo JWT de DESENVOLVIMENTO. Em producao, defina JWT_SECRET com um valor aleatorio.
loja.jwt.segredo=${JWT_SECRET:segredo-local-de-desenvolvimento-nao-usar-em-producao}

# RabbitMQ e microservico de logs do docker-compose.yml
spring.rabbitmq.username=${RABBITMQ_USERNAME:lojacarro}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:lojacarro}
loja.logs.api-key=${LOGS_API_KEY:chave-local-de-desenvolvimento}
