spring.application.name=LojaCarro

# Perfil padrao quando SPRING_PROFILES_ACTIVE nao for informado
spring.profiles.default=dev

# Banco de dados: as credenciais vem SEMPRE de variaveis de ambiente
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# O schema e criado/versionado pelo Flyway (db/migration). O Hibernate nao altera tabelas.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Erros: nunca devolver stack trace para o cliente
server.error.include-stacktrace=never
server.error.include-message=never

# Arquivo de log do sistema
logging.file.name=logs/lojacarro.log

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Administrador inicial (criado na inicializacao se ainda nao existir)
loja.admin.nome=${ADMIN_NOME:Administrador}
loja.admin.email=${ADMIN_EMAIL:}
loja.admin.senha=${ADMIN_SENHA:}

# JWT: o segredo (minimo 32 caracteres) vem SEMPRE da variavel de ambiente JWT_SECRET
loja.jwt.segredo=${JWT_SECRET}
loja.jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:120}

# Origens do frontend liberadas no CORS (separadas por virgula)
loja.cors.origens=${CORS_ORIGINS:http://localhost:4200}

# Fotografias dos veiculos: pasta de armazenamento e limite de 5 MB por arquivo
loja.imagens.diretorio=${IMAGENS_DIR:img}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Permite que o Tomcat leia o corpo excedente e devolva 413 em vez de derrubar a conexao
server.tomcat.max-swallow-size=10MB

# Horario de funcionamento para test drives (segunda a sexta / sabado; domingo fechado; sabado vazio = fechado)
loja.agenda.abertura=${AGENDA_ABERTURA:08:00}
loja.agenda.fechamento=${AGENDA_FECHAMENTO:18:00}
loja.agenda.fechamento-sabado=${AGENDA_FECHAMENTO_SABADO:12:00}

# RabbitMQ: os eventos de auditoria sao publicados para o microservico de logs
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Microservico de logs (consulta da tela de auditoria)
loja.logs.url=${LOGS_URL:http://localhost:8081}
loja.logs.api-key=${LOGS_API_KEY}
