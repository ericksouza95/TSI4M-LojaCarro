<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Usuários</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js"></script>
</head>
<body>
    <nav id="menu"></nav>

    <h1>Cadastro de Usuários</h1>

    <form id="formUsuario">
        <input type="hidden" id="id">

        <label for="nome">Nome:</label>
        <input type="text" id="nome" required>

        <label for="email">E-mail:</label>
        <input type="email" id="email" required>

        <label for="senha">Senha (mínimo 6 caracteres):</label>
        <input type="password" id="senha">
        <small id="dicaSenha" hidden>Deixe em branco para manter a senha atual.</small>

        <br>
        <button type="submit" id="btnSalvar">Cadastrar</button>
        <button type="button" onclick="limparFormulario()">Cancelar</button>
    </form>

    <div id="mensagem" class="mensagem"></div>

    <h2>Usuários cadastrados</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>E-mail</th>
                <th>Data de cadastro</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabelaUsuarios"></tbody>
    </table>

    <script>
        async function listarUsuarios() {
            const resposta = await api("/usuario/listarUsuarios");
            const usuarios = await resposta.json();
            const tabela = document.getElementById("tabelaUsuarios");
            tabela.innerHTML = "";

            usuarios.forEach(function (u) {
                const linha = adicionarLinha(tabela, [u.id, u.nome, u.email, formatarData(u.dataCadastro)]);
                adicionarAcoes(linha,
                    function () { editarUsuario(u); },
                    function () { excluirUsuario(u.id); });
            });
        }

        async function salvarUsuario(evento) {
            evento.preventDefault();
            const id = document.getElementById("id").value;
            const usuario = {
                nome: document.getElementById("nome").value,
                email: document.getElementById("email").value,
                senha: document.getElementById("senha").value
            };

            const resposta = id
                ? await enviarJson("/usuario/" + id, "PUT", usuario)
                : await enviarJson("/usuario/salvar", "POST", usuario);

            if (resposta.ok) {
                mostrarMensagem(id ? "Usuário atualizado com sucesso." : "Usuário cadastrado com sucesso.", false);
                limparFormulario();
                listarUsuarios();
                montarMenu();  // Atualiza o nome no menu caso o usuário logado tenha sido editado
            } else {
                mostrarMensagem(await lerErro(resposta), true);
            }
        }

        function editarUsuario(u) {
            document.getElementById("id").value = u.id;
            document.getElementById("nome").value = u.nome;
            document.getElementById("email").value = u.email;
            document.getElementById("senha").value = "";
            document.getElementById("dicaSenha").hidden = false;
            document.getElementById("btnSalvar").textContent = "Atualizar";
        }

        async function excluirUsuario(id) {
            if (!confirm("Deseja realmente excluir o usuário " + id + "?")) {
                return;
            }
            const resposta = await api("/usuario/" + id, { method: "DELETE" });
            if (resposta.ok) {
                mostrarMensagem("Usuário excluído com sucesso.", false);
                listarUsuarios();
            } else {
                mostrarMensagem(await lerErro(resposta), true);
            }
        }

        function limparFormulario() {
            document.getElementById("formUsuario").reset();
            document.getElementById("id").value = "";
            document.getElementById("dicaSenha").hidden = true;
            document.getElementById("btnSalvar").textContent = "Cadastrar";
        }

        document.getElementById("formUsuario").addEventListener("submit", salvarUsuario);
        montarMenu().then(listarUsuarios);
    </script>
</body>
</html>
