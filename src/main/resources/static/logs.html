<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Logs</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js"></script>
</head>
<body>
    <nav id="menu"></nav>

    <h1>Logs do Sistema</h1>

    <button type="button" onclick="listarLogs()">Atualizar</button>
    <br><br>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Data/Hora</th>
                <th>Usuário</th>
                <th>Ação</th>
                <th>Entidade</th>
                <th>Descrição</th>
            </tr>
        </thead>
        <tbody id="tabelaLogs"></tbody>
    </table>

    <script>
        async function listarLogs() {
            const resposta = await api("/log");
            const logs = await resposta.json();
            const tabela = document.getElementById("tabelaLogs");
            tabela.innerHTML = "";

            logs.forEach(function (log) {
                adicionarLinha(tabela, [log.id, formatarData(log.dataHora), log.usuario, log.acao, log.entidade, log.descricao]);
            });
        }

        montarMenu().then(listarLogs);
    </script>
</body>
</html>
