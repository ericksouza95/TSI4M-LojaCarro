spring.application.name=logs-service
spring.datasource.url=jdbc:h2:mem:logsdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Nos testes o consumo da fila nao e iniciado (nao ha RabbitMQ); o listener e chamado diretamente
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
logs.api-key=chave-usada-nos-testes-123
