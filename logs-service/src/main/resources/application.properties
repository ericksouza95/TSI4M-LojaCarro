spring.application.name=logs-service
server.port=${PORT:8081}
spring.profiles.default=dev

# Banco proprio do microservico (separado do banco da loja)
spring.datasource.url=${LOGS_DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
# Mensagem que falhar nao volta para a fila (vai para a fila de descarte), evitando reprocessamento infinito
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s

# Chave exigida para consultar os logs (enviada pela API da loja)
logs.api-key=${LOGS_API_KEY}

server.error.include-stacktrace=never
