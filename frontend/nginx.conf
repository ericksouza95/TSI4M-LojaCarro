server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Upload das fotos (limite da aplicação é 5 MB por imagem)
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # DNS interno do Docker: o endereço do backend é consultado de novo a cada 10 s,
    # assim o Nginx continua funcionando quando o container da API é recriado (novo IP)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://api:8080;

    # API e documentação Swagger -> container do backend
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos gerados pelo build têm o hash no nome: podem ficar em cache por muito tempo
    location ~* \.(?:js|css|woff2?|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Rotas do Angular (ex.: /veiculos/3) sempre devolvem o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
